# Ping darmowego projektu Supabase, żeby nie usnął.
#
# Darmowy plan Supabase pauzuje projekt (zatrzymuje bazę) po 7 dniach
# CAŁKOWITEGO braku ruchu - a wybudzenie wymaga ręcznego kliknięcia
# "Restore" w panelu Supabase, nie dzieje się samo od requestu. Ten
# workflow odpytuje projekt kilka razy w tygodniu, żeby ten licznik
# bezczynności nigdy nie doszedł do 7 dni.
#
# WYMAGANE DO DZIAŁANIA:
# 1. W Supabase (SQL Editor) uruchom supabase/migrations/0002_keepalive.sql
#    - tworzy funkcję public.keepalive(), którą ten workflow wywołuje.
# 2. W ustawieniach repo (Settings -> Secrets and variables -> Actions)
#    dodaj dwa sekrety:
#   SUPABASE_URL       - np. https://xxxxxxxx.supabase.co
#   SUPABASE_ANON_KEY  - klucz publishable (sb_publishable_...), ten sam co
#                        EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY w .env
#
# Nie pingujemy /rest/v1/ - przy nowych kluczach ten endpoint wymaga klucza
# secret i zwraca 401. Klucza publishable nie wysyłamy też jako
# "Authorization: Bearer" - to nie jest JWT i zostałby odrzucony.
#
# UWAGA: GitHub sam wyłącza cykliczne (`schedule`) workflowy w repo, w
# którym nie było ŻADNEJ aktywności (commitów) od 60 dni - to osobny,
# niezależny limit, nie ma z tym nic wspólnego Supabase.
name: Supabase keep-alive

on:
  schedule:
    # 06:00 UTC w niedzielę, środę i piątek - odstępy 2-3 dni, bezpiecznie
    # pod limitem 7 dni bezczynności.
    - cron: '0 6 * * 0,3,5'
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase REST endpoint
        run: |
          if [ -z "${{ secrets.SUPABASE_URL }}" ] || [ -z "${{ secrets.SUPABASE_ANON_KEY }}" ]; then
            echo "Brak sekretów SUPABASE_URL / SUPABASE_ANON_KEY - dodaj je w Settings > Secrets and variables > Actions."
            exit 1
          fi
          curl -sS --fail-with-body -X POST "${{ secrets.SUPABASE_URL }}/rest/v1/rpc/keepalive" \
            -H "apikey: ${{ secrets.SUPABASE_ANON_KEY }}" \
            -H "Content-Type: application/json" \
            -d '{}'
